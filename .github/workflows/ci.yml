name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate module and example
        run: |
          for d in modules/baseline examples/customer-deployment; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - name: Security tests (mock provider, no Azure account)
        run: terraform -chdir=modules/baseline test -verbose
      - uses: terraform-linters/setup-tflint@v4
      - name: TFLint
        run: tflint --init && tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl"

  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: Checkov (fails on any finding without a written justification)
        run: checkov -d . --framework terraform --compact --quiet --download-external-modules false
